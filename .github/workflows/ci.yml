name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promohit
          POSTGRES_PASSWORD: promohit
          POSTGRES_DB: promohit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://promohit:promohit@localhost:5432/promohit_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run all tests (unit + boot + e2e)
        run: npm test

  # Deploys main to Railway via the CLI — a reliable fallback that doesn't depend
  # on Railway's GitHub webhook integration. Intentionally NOT gated on the test
  # job (matches Railway's own behavior of deploying regardless of CI); add
  # `needs: test` here once CI has a stable green streak.
  #
  # Setup (one-time, in GitHub repo settings):
  #   Secrets → RAILWAY_TOKEN          a Railway PROJECT token (Railway project →
  #                                    Settings → Tokens) for the production env
  #   Variables → RAILWAY_WEB_SERVICE     name of the web service in Railway
  #   Variables → RAILWAY_WORKER_SERVICE  name of the worker service in Railway
  # Until RAILWAY_TOKEN is set, this job skips with a notice.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
      WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
    steps:
      - name: Redeploy Railway services
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::RAILWAY_TOKEN secret not set — skipping deploy (Railway's own GitHub integration is assumed to handle it)."
            exit 0
          fi
          npm i -g @railway/cli
          for svc in "$WEB_SERVICE" "$WORKER_SERVICE"; do
            if [ -z "$svc" ]; then
              echo "::warning::RAILWAY_WEB_SERVICE / RAILWAY_WORKER_SERVICE repo variable not set — skipping that service."
              continue
            fi
            echo "Redeploying service: $svc"
            railway redeploy --service "$svc" --yes
          done
